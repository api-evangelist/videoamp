generated: '2026-08-02'
method: searched
source: https://github.com/VideoAmp/cli
name: videoamp
description: First-party VideoAmp CLI. A single Go binary that exposes the same capabilities as the VideoAmp Public API, and can also run the VideoAmp MCP server locally.
docs: https://github.com/VideoAmp/cli#cli-installation
releases: https://github.com/VideoAmp/cli/releases
latest_version: v0.148.32
api_edition: '2026-07-31'
language: go
install:
- method: github-release
  platforms:
  - darwin/amd64
  - darwin/arm64
  - linux/amd64
  - linux/arm64
  - windows/amd64
  steps: Download the asset matching your OS/arch from the releases page, extract, and move `videoamp` onto your $PATH.
- method: devcontainer
  steps: Open the repo as a GitHub Codespace — the devcontainer provisions `videoamp` and wires Copilot to the remote MCP server.
auth:
  login_command: videoamp login
  description: Browser-based OAuth 2.0 login against login.videoamp.com; the token is cached in the CLI config.
  config_file: $HOME/.videoamp/config.yaml
global_flags:
- flag: --config
  description: config file (default $HOME/.videoamp/config.yaml)
- flag: -j, --json
  description: JSON request body for POST/PATCH commands
- flag: -c, --csv-output
  description: write results to a CSV file
- flag: -o, --oas
  description: print the OpenAPI spec for the command as JSON (requires login)
- flag: -m, --mcp-tool
  description: print the MCP tool definition for the command as JSON (requires login)
- flag: --encrypt-key
  description: encrypt / decrypt sensitive values
config_keys:
- key: api_host
  default: api.videoamp.dev
- key: login_host
  default: login.videoamp.com
- key: env
  default: prod
  values:
  - prod
  - staging
  - preprod
- key: verbose
  default: 'false'
management_commands:
- command: login
  summary: obtain an access_token via the browser
- command: logout
  summary: clear the cached token
- command: version
  summary: print CLI version, api_edition and docs URL
- command: config get|set|list
  summary: manage CLI configuration
- command: mcp list-tools
  summary: list the MCP tools built from the API spec
- command: mcp start-server
  summary: run the VideoAmp MCP server locally
api_command_count: 118
