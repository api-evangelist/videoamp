notes:
  - >-
    Organization is the tenancy root. Visibility inherits downward: resources permissioned to a
    parent organization are visible to all child advertisers, and multi-advertiser filters return a
    deduplicated union rather than a concatenation.
  - >-
    The Sharing API names the organization kind `ORGANIZATION` where the user API names the same
    thing `HOLDING_COMPANY`; the values must be translated when crossing between the two surfaces.
  - >-
    No component schemas are published anonymously, so no field types, required-field sets or
    nested object shapes are captured here.
