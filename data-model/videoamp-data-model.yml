description: >-
  Entity-relationship graph for the VideoAmp Public API, derived from the resource nesting in the
  118 operation paths and the id-reference parameters they accept. VideoAmp publishes no anonymous
  component schemas — the OpenAPI request/response bodies are Auth0-gated — so this graph is built
  from path structure and documented id parameters only, and carries no field-level attributes.
identifiers:
  primary: UUID v4
  legacy_numeric: >-
    Some resources additionally accept a legacy integer id encoded as a string. Audiences expose
    both `ids` (UUID) and `legacyIds`; UUID is documented as preferred for new integrations.
  prefixed_ids: false
domains:
  - name: audience
    description: Audience definitions, their classifications and their export/share lifecycle.
    entities: [Audience, AudienceExport, AudienceStatus, DemographicFilterField, DemographicFilterValue, IdType]
  - name: planning
    description: Campaigns, inventory sets and the media plans optimized against them.
    entities: [Campaign, Plan, DraftPlan, Inventory, RateCard, ReachCurve]
  - name: measurement
    description: Ad measurement reports and their post-process (lift) analyses.
    entities: [AdMeasurement, PostProcess]
  - name: content
    description: Content metadata and content measurement metrics.
    entities: [Network, MediaGroup, Program, Episode, ContentMetric, MetricTypeCompatibilityMatrix, CurrencyOfRecord]
  - name: library
    description: Datasource discovery, grouping and rule definitions used to scope reporting.
    entities: [DatasourceGroup, DatasourceGroupRule, ConversionGroup, DatasourceSchema, DatasourceMetadata]
  - name: data-management
    description: Customer data onboarding — streams, schema mapping, delivery and ingestion.
    entities: [DataStream, DataStreamType, SchemaMapping, DeliveryConfig, DeliveryInspection, DeliveryInspectionFile, Ingestion, UploadedFile]
  - name: collaboration
    description: Cross-organization sharing and consent.
    entities: [Share, Consent, Recipient, RevocationRequest]
  - name: identity
    description: The calling user and their organization memberships.
    entities: [User, Organization]
  - name: reporting
    description: Semantic report querying.
    entities: [Report, ScopedQuery]
