        schema:
          type: string
        description: 'Filter Datasource Groups by Measurement request type. Defaults to ''AD_MEASUREMENT'' if not specified. Available, valid scopes are: ''AD_MEASUREMENT'' and ''CONTENT_MEASUREMENT''. This filter is critical for ensuring compatibility between Datasource Groups and target report type: Ad Measurement reports require ''AD_MEASUREMENT'' groups while Content Measurement reports require ''CONTENT_MEASUREMENT'' groups. Groups are configured with specific reporting scope at creation time. Attempting to use groups with mismatched reporting scope in report creation will result in validation error. - REPORTING_SCOPE_UNSPECIFIED: Value when unspecified. Should not be used directly. - AD_MEASUREMENT: For Datasource Groups to be used for advertising campaign measurement and attribution analysis. Groups within this scope contain vendor measurement data focused on ad exposure, reach, frequency, and campaign effectiveness metrics. - CONTENT_MEASUREMENT: For Datasource Groups to be used for content viewership and audience measurement analysis. Groups within this scope contain viewing data focused on program ratings, audience composition, and content consumption patterns.'
      - name: search
        in: query
