  /v1beta/library/datasourceMetadataSearch:
    post:
      operationId: datasource_metadata_search
      summary: Search Datasource Metadata
      tags:
      - library
      description: |-
        ### What

        Queries actual data values for a datasource, returning distinct metadata rows based on the requested fields and filters. Supports pagination, search, and ordering.

        The endpoint automatically injects required fields (parent filters, supplemental labels) into the response based on the datasource schema hierarchy. This means requesting a child field will automatically include its required parent fields.

        ### Why

        Retrieves the concrete values available for datasource filters — the data that populates filter dropdowns, catalog tables, and airing selection modals.

        **Business Scenarios:**
        - User browses available pixels for VA_PIXEL datasource: `distinct_fields: ["pixel_id"]` returns pixel IDs + names
        - Agent fetches campaigns under a specific pixel: `distinct_fields: ["campaign_id"], filters: [{name: "pixel_id", values: ["123"], operator: "in"}]`
        - User searches for airings on a linear network for tune-in CG: `distinct_fields: ["program_name"], search: "NFL"`

        ### When

        Call after calling `GET /v1beta/library/datasourceSchema` to discover the available fields and their hierarchy.

        **Important:** The schema determines which fields are valid for `distinct_fields` and `filters`. Required parent filters are auto-injected, but providing them explicitly in `filters` narrows results.

        **Do NOT use when:**
        - You need to discover the field structure (use `GET /v1beta/library/datasourceSchema` first)
        - You need the list of available datasource types (use `POST /v1/library/datasourceTypeOptionsSearch`)

        **Next Steps:** Use the returned metadata values as filter selections when creating or editing Datasource Groups or Conversion Groups.

        ### How

        **Discovery Pattern:** Call schema first to learn fields. Then call this endpoint with desired `distinct_fields`. Use `filters` to narrow results (e.g., filter by parent hierarchy value). Use `search` for text matching across fields. Paginate with `page_token` from previous response.
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp datasource_metadata_search --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: datasource_metadata_search
  /v1beta/library/datasourceSchema:
    get:
      operationId: datasource_schema_get
      summary: Get Datasource Schema
      tags:
      - library
      description: |-
        ### What

        Returns the hierarchical schema for a specific datasource type, describing all available filter hierarchies, rule filter hierarchies, and supporting metadata fields.

        The schema is a tree structure where each node represents a filterable field. Nodes can have children (forming a hierarchy), supporting data (labels, links, metrics), and a required flag indicating whether the filter must be provided.

        ### Why

        Discovers the structure of a datasource before querying its metadata. The schema tells you which fields exist, how they relate hierarchically, and which are required.

        **Business Scenarios:**
        - Agent discovers that VA_PIXEL has a hierarchy: advertiser_id → source_type_id → campaign_id → line_item_id
        - User learns that NATIONAL_LINEAR_BROADCAST_AND_CABLE requires `network` as a mandatory filter
        - Agent identifies which fields are available as `distinct_fields` for `DatasourceMetadataSearch`

        ### When

        Call after selecting a `datasource_type` from `POST /v1/library/datasourceTypeOptionsSearch` for a Datasource Group. If building a Conversion Group, call after selecting a `data_provider_id` from `POST /v1/library/conversionDataProviderOptionsSearch` — each provider has a different schema. Call before `POST /v1beta/library/datasourceMetadataSearch`.

        **Do NOT use when:**
        - You need the actual data values (use `POST /v1beta/library/datasourceMetadataSearch`)
        - You need the list of available datasource types (use `POST /v1/library/datasourceTypeOptionsSearch`)

        **Next Steps:** Use field names from `datasource_filter_hierarchies` as `distinct_fields` and `filters` in `POST /v1beta/library/datasourceMetadataSearch`.

        ### How

        **Discovery Pattern:** Call with datasource_type (+ data_provider_id for CGs). Parse `datasource_filter_hierarchies` to understand the filter tree. Fields marked `is_required: true` must be included when querying metadata. Use `supporting_data` fields to get human-readable labels alongside IDs.
      parameters:
      - name: advertiserId
        in: query
        required: false
        schema:
          type: string
        description: '**Required** Advertiser (business unit) to scope results to. Obtain available ids by calling ''GET /v1/me?membership_kinds=ADVERTISER'' and using the ''id'' field from the ''memberships'' array.'
      - name: agencyAdvertiserId
        in: query
        required: false
        schema:
          type: string
        description: '**Deprecated** Ignored if advertiser_id is provided.'
      - name: currencyOfRecord
        in: query
        required: false
        schema:
          type: string
        description: '**Conditionally Required** when ''datasource_type=NATIONAL_LINEAR_BROADCAST_AND_CABLE'' or ''data_provider_id=linear_tune_in''. Retrieve valid options from ''GET /external/v1/currency-of-record''. When provided, ''data_latency'' must also be specified. For ConversionGroups with ''data_provider_id=linear_tune_in'', use 26.'
      - name: dataLatency
        in: query
        required: false
        schema:
          type: string
        description: '**Conditionally Required** when ''currency_of_record'' is provided. PRELIMINARY and NEXT_NEXT_DAY are only available when used with NATIONAL_LINEAR_BROADCAST_AND_CABLE datasources. When ''data_provider_id=linear_tune_in'', use FINAL. - DATA_LATENCY_UNSPECIFIED: No selection; Default value. - FINAL: Fully reconciled data with complete accuracy. Available 2-3 weeks after broadcast. **DSGs:** Valid when reporting_scope=AD_MEASUREMENT with KANTAR_COMMINGLE or NATIONAL_LINEAR_AND_BROADCAST_CABLE datasources; or reporting_scope=CONTENT_MEASUREMENT. **CGs:** Required when data_provider_id=linear_tune_in; not valid otherwise. - PRELIMINARY: Fast-processed data, 3-4 days after broadcast, subject to revisions. **DSGs:** Valid when reporting_scope=CONTENT_MEASUREMENT and currency_of_record supports it. **CGs:** Not valid. - NEXT_NEXT_DAY: Near real-time data, ~2 days after broadcast. Volatile. **DSGs:** Valid when reporting_scope=CONTENT_MEASUREMENT and currency_of_record supports it. **CGs:** Not valid.'
      - name: dataProviderId
        in: query
        required: false
        schema:
          type: string
        description: '**Conditionally Required** when ''datasource_type=CONVERSIONS''. Used for ConversionGroups (CGs). Obtain valid values by calling ''POST /v1/library/conversionDataProviderOptionsSearch'' and using the ''value'' field from results.'
      - name: datasourceType
        in: query
        required: true
        schema:
          type: string
        description: Required. The datasource type to retrieve the schema for. Used for DSGs. CGs will use CONVERSIONS as the datasource type and require data provider id to be specified. Obtain valid values by calling 'POST /v1/library/datasourceTypeOptionsSearch' and using the 'value' field from results.
      - name: reportingScope
        in: query
        required: false
        schema:
          type: string
        description: 'Required when DatasourceType is not CONVERSIONS. Should be same value used when calling ''POST /v1/library/datasourceTypeOptionsSearch''. Use AD_MEASUREMENT to query for datasource types used to measure impressions. Use CONTENT_MEASUREMENT to query for datasource types used to measure content viewership. - REPORTING_SCOPE_UNSPECIFIED: Value when unspecified. Should not be used directly. - AD_MEASUREMENT: For Datasource Groups to be used for advertising campaign measurement and attribution analysis. Groups within this scope contain vendor measurement data focused on ad exposure, reach, frequency, and campaign effectiveness metrics. - CONTENT_MEASUREMENT: For Datasource Groups to be used for content viewership and audience measurement analysis. Groups within this scope contain viewing data focused on program ratings, audience composition, and content consumption patterns.'
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: datasource_schema_get
  /v1beta/plans:
    post:
      operationId: plan_create
      summary: Create Plan
      tags:
      - plans
      description: |-
        Creates a new media plan optimization scenario. The plan defines a budget allocation strategy across inventory titles and constraints to maximize reach, impressions, or audience concentration for a campaign.

        **Why**: Run reach and frequency optimization against a campaign's inventory set. Plans are the core output of the media planning workflow, producing optimized budget allocations. Use `OBJECTIVE_FORECAST_ONLY` to skip optimization and forecast reach, impressions, and frequency directly from a fixed unit allocation — useful for secondary-read use cases where the buy has already been committed in another currency.

        **When**: Call after creating a campaign with valid audiences and an inventory set. Requires a campaign ID, a budget, and rates (via rate card or overrides). Use `validate_only=true` to pre-validate inputs without triggering optimization.

        **How**: Submit the plan configuration in the request body. Returns 201 with the created plan including server-assigned `id` and initial `status` (QUEUED). The plan processes asynchronously — poll `GET /v1beta/plans/{plan_id}` to check status (QUEUED → PROCESSING → READY or FAILED).

        **Forecast-only workflow** (skip optimization, forecast from fixed units):
        1. Set `primary_objective.objective_type` to `OBJECTIVE_FORECAST_ONLY`. Set `budget` to `"0"`.
        2. Add one `FIXED_INVESTMENT_UNITS` constraint per title: `constraint_type: FIXED_INVESTMENT_UNITS`, `operator: EQUAL`, `goal: "<unit_count>"`, `creative_duration_seconds`, and `title_filters` with `title_filter_type: ID`.
        3. Omit `target_budget`, saturation rules, and frequency rules — all are rejected with HTTP 400 when combined with `OBJECTIVE_FORECAST_ONLY`.
        4. Do not combine `OBJECTIVE_FORECAST_ONLY` with any `OBJECTIVE_MAXIMIZE_*` objective on the same plan.
        5. Poll `GET /v1beta/plans/{plan_id}` until `status` is `READY`, then download results from the `output` URL.
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp plan_create --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad Request — invalid or unsupported parameter values.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: plan_create
    get:
      operationId: plan_list
      summary: List Plans
      tags:
      - plans
      description: |-
        Returns a paginated, filterable list of Plans accessible to the caller. Plans represent optimization scenarios that allocate budget across campaigns and inventory titles.

        **Why**: Discover and manage plans across your organization. Use to find completed plans for result retrieval, monitor processing status, or audit plan configurations.

        **When**: Call when building a plan management UI, checking optimization status across multiple plans, or filtering plans by status, creator, or campaign.

        **How**: All parameters are optional. Narrow results using `statuses`, `displayNames`, `createdBy`, `campaignIds`, or `inventorySetIds` filters. Sort with `orderBy` (defaults to `created_at desc`). Paginate with `pageSize` and `pageToken`. The `total_size` field reflects all matching plans across all pages.
      parameters:
      - name: campaignIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Optional filter by campaign UUID. Returns plans that include the specified campaigns. Pass multiple values as repeated query params for OR logic.
      - name: createdBy
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Optional filter by the user ID who created the plan. Provide creator UUIDs to retrieve only plans created by those users. Pass multiple values as repeated query params for OR logic.
      - name: displayNames
        in: query
        required: false
        schema:
          type: string
        description: Optional filter by plan name using case-insensitive substring matching on the display_name field. Returns plans whose name contains the provided string. Pass multiple values as repeated query params for OR logic.
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: 'Optional filter by plan UUIDs. Pass multiple values as repeated query params: ?ids=uuid1&ids=uuid2. Use for efficient batch retrieval when you already know which specific plans you need. Plans not found or not accessible to the caller are silently omitted from results rather than causing an error.'
      - name: inventorySetIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Optional filter by inventory set UUID. Returns plans associated with the specified inventory sets. Pass multiple values as repeated query params for OR logic.
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
        description: 'This field specifies how to order the list results. If no value is provided, the results will be sorted by created_at descending order. Specify the order by providing a comma separated list of ''field_name direction'' strings. Omitted direction defaults to asc. Example: ''created_at desc, display_name'' Accepted Values: - ''status'' - ''failure_msg'' - ''display_name'' - ''inventory_set_id'' - ''budget'' - ''minimum_investment'' - ''created_at'' - ''created_by'' Accepted Sort: - ''desc'' - ''asc'''
      - name: pageSize
        in: query
        required: false
        schema:
          type: string
        description: Query param pageSize specifies the number of results to include in a page of results. Defaults to 100 when omitted. Maximum value is 1000.
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: Query param 'pageToken' specifies the value of the next page to retrieve within a paginated set of results. Valid values can be found in paginated responses that include field 'next_page_token'. When requesting the next page, additional query parameters should NOT change between page requests.
      - name: statuses
        in: query
        required: false
        schema:
          type: string
        description: 'Optional filter by plan processing status. Use to find completed plans (READY), in-progress plans (PROCESSING/QUEUED), or failed plans (FAILED). Pass multiple values for OR logic. - STATUS_UNSPECIFIED: Status is unspecified. Default proto3 zero value. Do not use in client logic. - QUEUED: The plan has been created and its required data dependencies are being resolved. Transitions to PROCESSING once all required data is available. - PROCESSING: The plan optimization is actively running. Processing time varies based on plan complexity (number of titles, constraints, and audience combinations). - READY: The plan optimization completed successfully. Results are available via the output field which contains a presigned S3 URL for downloading the optimized allocation. - FAILED: The plan optimization failed. Check `failure_msg` for a human-readable error message and `status_info` for structured error details (code, status, diagnostics). Common causes include invalid inventory data, insufficient rates, or optimizer errors. Fix the configuration and create a new plan to retry. - DRAFT: The plan has been created and allows further modification'
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: plan_list
  /v1beta/plans/{planId}:
    delete:
      operationId: plan_delete
      summary: Delete Plan
      tags:
      - plans
      description: |-
        Deletes a Plan, removing it from all API responses. This action cannot be undone through the API — there is no undelete operation.

        **Why**: Remove plans that are no longer needed, were created in error, or have been superseded by a new optimization scenario.

        **When**: Call when a plan is no longer required regardless of its current status (QUEUED, PROCESSING, READY, and FAILED plans can all be deleted). Verify the plan exists via `GET /v1beta/plans/{plan_id}` before deleting.

        **How**: Supply the plan UUID as the `plan_id` path parameter. Returns 204 with an empty body on success. Returns 404 if the plan does not exist or is not accessible. In-flight optimization may continue briefly after deletion but will not produce results.
      parameters:
