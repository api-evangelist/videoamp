        ### How

        The caller must have write access on the parent DataStream's advertiser. Each binding's `raw_columns` must be non-empty, unique within the binding, and drawn from the columns discovered in the latest delivery inspection; otherwise 400 is returned naming the offending column. The parent DataStream must exist within the caller's access scope, otherwise 404 is returned.

        ### Related operations

        - `GET /v1alpha/dataStreams/{dataStreamId}/schemaMapping` — retrieve the current SchemaMapping.
        - `POST /v1alpha/dataStreams/{dataStreamId}/schemaMapping:approve` — next step: lock the mapping and start ingestion.
