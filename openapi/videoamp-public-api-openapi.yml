  /v2/audiences:
    post:
      operationId: audience_create
      summary: Create Audience
      tags:
      - audiences
      description: |-
        Creates a new audience resource and queues it for processing. Returns the created Audience object with `status=QUEUED`. **Status lifecycle**: `QUEUED` → `PROCESSING` → `READY` (success) or `FAILED` (error). `READY` and `FAILED` are terminal; `QUEUED` and `PROCESSING` are non-terminal. Processing typically takes 10–20 minutes for common audience types; large or complex audiences (e.g., `COMPOSITE`, `USER_PROVIDED` with high identity-match volume) may take longer. Do not treat `PROCESSING` as a terminal state.

        **Why**: The primary entry point for creating any audience type in the VideoAmp platform. Supports all audience classifications: EXPOSURE, CONTENT, CUSTOM_DEMOGRAPHIC, USER_PROVIDED, COMPOSITE, and MODELED. Use `validate_only=true` to test a request without creating the audience (REST callers: pass as query parameter `?validateOnly=true`).

        **When**: Call when you need to build a new audience for measurement or export. Classification-specific pre-conditions: **CUSTOM_DEMOGRAPHIC** — discover valid field identifiers via GET /v2/audiences/lookupDemographicFilterFields, then values via GET /v2/audiences/lookupDemographicFilterValues. **USER_PROVIDED** — confirm valid `id_types` values with your VideoAmp representative (account-specific; no v2 discovery endpoint available). **COMPOSITE** — ensure all component audiences have `status=READY` before calling. **MODELED** — the seed audience must be `READY` and an eligible seed type (see `origin_audience`).

        **How**: Set `classification` and the matching definition object, plus `currency_of_record`. The response `id` (UUID) is used to check status and reference the audience in downstream APIs. Only `READY` audiences are eligible for measurement; exports accept audiences in any status. Related: GET /v2/audiences/{id} (check status), GET /v2/audiences (list), GET /v2/audiences/lookupDemographicFilterFields (discover CUSTOM_DEMOGRAPHIC fields).
      parameters:
      - name: validateOnly
        in: query
        required: false
        schema:
          type: string
        description: When true, validates the request body (required fields, enum values, permissions) without creating the audience. Use to pre-flight a create request before committing — especially useful when building audience creation UI or automating bulk audience creation workflows where early error detection reduces wasted processing. Defaults to `false`. A successful validate-only response does not guarantee a subsequent create will succeed if underlying data changes between calls. (default true)
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp audience_create --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: audience_create
    get:
      operationId: audience_list
      summary: List Audiences
      tags:
      - audiences
      description: |-
        Returns a paginated, filterable list of audiences accessible to the calling organization. The caller's organization context controls visibility; the `use_cases` field on each audience determines eligible downstream operations.

        **Why**: Discover and enumerate audiences before passing them to downstream workflows. Use this endpoint to find READY audiences by classification, ownership, use case, or name before creating measurements or exports. Use GET /v2/audiences/{id} when the audience UUID is already known.

        **When**: Call when checking which audiences are available for a measurement campaign; filtering by `useCases` to understand workflow eligibility; discovering SHARED cross-org audiences; retrieving GLOBAL_DEMOGRAPHIC audiences with `broadcastDate` and `currencyOfRecord`; or looking up IDs for share, export, or measurement APIs.

        **How**: Apply filters to narrow results, then pass the returned `id` (UUID) to downstream APIs. Only READY audiences are eligible for measurement — exports can be created against an audience in any status. Do not change filter parameters between pages. `total_size` is a point-in-time snapshot and may change between page requests — use the absence of `next_page_token` to detect the final page. Related: POST /v2/audiences (create), GET /v2/audiences/{id} (retrieve by ID), GET /v2/audiences/lookupDemographicFilterFields (discover CUSTOM_DEMOGRAPHIC filter fields).
      parameters:
      - name: advertiserIds
        in: query
        required: false
        schema:
          type: string
        description: 'Filters audiences by permissioned advertiser UUID(s). Includes audiences permissioned directly to the advertiser as well as those permissioned to any ancestor organization. **Org-level inheritance**: Audiences permissioned to a parent org are visible to all child advertisers. Filtering by two advertisers in the same org may return identical results — both inherit the same org-level pool. This is expected behavior, not a bug. **Multi-advertiser queries**: Results are a deduplicated union, not a concatenation. total_size equals the union count — do not sum per-advertiser counts. **Advertiser-exclusive audiences**: To find audiences exclusive to one advertiser, inspect `permissioned_entities` on each result and filter client-side. Values must be valid UUIDs; duplicates are not permitted.'
      - name: agencyIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Filters audiences by permissioned agency UUID(s). Returns audiences accessible to the given agency IDs. Includes audiences permissioned directly to the agency as well as those permissioned to any of its ancestor organizations. Values must be valid UUIDs; duplicates are not permitted.
      - name: broadcastDate
        in: query
        required: false
        schema:
          type: string
        description: Selects which broadcast year's metrics to return based on the broadcast year range containing the specified date. Only applies to 'GLOBAL_DEMOGRAPHIC' audiences; ignored for other types. Uses ISO-8601 date format ('YYYY-MM-DD'). If omitted, the most recent metrics for the given 'currencyOfRecord' are returned. If the date falls outside the available range for the currency of record, a 400 error is returned with the valid date range.
      - name: cadences
        in: query
        required: false
        schema:
          type: string
        description: 'Filters audiences by their refresh cadence — how frequently the audience membership is recalculated. Use to find audiences with specific refresh patterns for scheduling-sensitive workflows. Accepts multiple values (OR logic); case-insensitive. Available values: ONE_TIME, `WEEKLY`, `MONTHLY`, `QUARTERLY`.'
      - name: classifications
        in: query
        required: false
        schema:
          type: string
        description: 'Filters audiences by their __classification__. Case-insensitive. Accepts multiple values (OR logic). Available values: - EXPOSURE - `CONTENT` - `CUSTOM_DEMOGRAPHIC` - `USER_PROVIDED` - `GLOBAL_DEMOGRAPHIC` - `COMPOSITE` - `MODELED` **Note on `GLOBAL_DEMOGRAPHIC` and `use_cases`:** `GLOBAL_DEMOGRAPHIC` audiences vary in their supported `use_cases`. Not all `GLOBAL_DEMOGRAPHIC` audiences support `AD_MEASUREMENT` — some only support `CONTENT_MEASUREMENT`. Combining `classifications=GLOBAL_DEMOGRAPHIC` with `useCases=AD_MEASUREMENT` returns only the subset that supports ad measurement. Omit the `useCases` filter to retrieve all `GLOBAL_DEMOGRAPHIC` audiences regardless of supported use cases.'
      - name: createdByName
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive substring filter on the 'created_by_name' field of the audience. Useful for finding audiences created by a specific user or team. Matches any audience whose creator's display name contains the supplied string. Combine with 'ownership=OWNED' to narrow results to audiences created by your organization.
      - name: currencyOfRecord
        in: query
        required: false
        schema:
          type: string
        description: Filters audiences by their currency of record, which identifies the measurement panel and the data and methodologies used for VideoAmp currency guarantees within a given broadcast year. For 'GLOBAL_DEMOGRAPHIC' audiences, combine with 'broadcastDate' to select the correct metrics. Provide as a numeric string (int64 encoded as string). Invalid or unavailable values return a 400 error listing valid options.
      - name: description
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive substring filter on the audience 'description' field. Matches any audience whose description contains the supplied string. Useful for finding audiences annotated with specific campaign or workflow context. Combine with 'name' or 'classifications' for more precise filtering. Empty string or omitting this parameter returns all audiences regardless of description. Use the 'search' parameter instead for broader matching across multiple fields.
      - name: excludeClassifications
        in: query
        required: false
        schema:
          type: string
        description: 'Query param excludeClassifications will exclude audiences that have the specified __classification__. This field is case insensitive. The available options and restrictions for this field are the same as the __classifications__ filter. For example, to retrieve all audiences except `GLOBAL_DEMOGRAPHIC` audiences: `excludeClassifications=GLOBAL_DEMOGRAPHIC`.'
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Filters to a specific set of audiences by their UUID id values. Use when you already know which audiences you need — e.g., to batch-fetch metadata for a saved list of audience IDs. Values must be valid UUIDs. Combine with `statuses=READY` to verify all listed audiences are usable.
      - name: legacyIds
        in: query
        required: false
        schema:
          type: string
        description: Filters to a specific set of audiences by their legacy numeric legacy_id values. Use when integrating with systems that store legacy integer IDs rather than UUIDs. Prefer `ids` (UUID) for new integrations; use `legacy_ids` only when working with older systems or data stores that reference the numeric ID.
      - name: level
        in: query
        required: false
        schema:
          type: string
        description: 'Filters audiences by measurement granularity. ''HOUSEHOLD'': household-level metrics (default for most classifications). ''PERSON'': person-level metrics for ''GLOBAL_DEMOGRAPHIC'' audiences. Omit to return all levels. Unsupported combinations return empty metrics fields. - LEVEL_UNSPECIFIED: Default filter value; returns all audiences regardless of level. Do not use in requests — omit instead. - HOUSEHOLD: Household-level reach and frequency metrics. The default for most classifications. - PERSON: Person-level demographic metrics. Available only for GLOBAL_DEMOGRAPHIC audiences.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive substring filter on the audience 'name' field. Matches any audience whose name contains the supplied string. Use this to narrow results when browsing audiences for a specific campaign. Combine with 'statuses' or 'classifications' to further refine results. Empty string or omitting this parameter returns all audiences regardless of name. Use the 'search' parameter instead for broader matching across multiple fields.
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
        description: 'Controls the sort order of returned audiences. Specify a comma-separated list of field_name direction pairs. Direction is optional; omit for ascending order, use ''desc'' for descending. Defaults to ''created_at desc'' (most recently created first) when omitted. Sortable fields: ''created_at'', ''created_by_name'', ''name'', ''currency_of_record'', ''legacy_id''. Example: ''currency_of_record, name desc'' sorts by currency of record ascending, then name descending.'
      - name: ownership
        in: query
        required: false
        schema:
          type: string
        description: 'Filters by audience ownership relative to the calling organization. ''OWNED'': audiences created by your organization. ''SHARED'': audiences another organization has granted you access to via the Resource Sharing API — use when collaborating cross-org on measurement or activation campaigns. ''SYSTEM'': VideoAmp-provided audiences such as GLOBAL_DEMOGRAPHIC audiences. Omit to return all three ownership types. Only one value is accepted per request.'
      - name: pageSize
        in: query
        required: false
        schema:
          type: string
        description: Query param pageSize specifies the number of results to include in a page of results. Defaults to a server-determined page size when omitted. Use larger values (100-500) for batch processing or data export workflows; use smaller values for interactive UI displays with progressive loading. Pair with `pageToken` to paginate through large result sets. Must be a positive integer; excessively large values may increase response latency.
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: Query param 'pageToken' specifies the value of the next page to retrieve within a paginated set of results. Valid values can be found in paginated responses that include field 'next_page_token'. When requesting the next page, additional query parameters should NOT change between page requests.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Filters audiences by matching the provided string against name, description, id, or uuid (case-insensitive). Returns audiences where any of these fields contain the given value. Use this parameter for broad searches when the exact field is unknown or does not matter. For more precise filtering, use the 'name' or 'description' query parameters instead.
      - name: statuses
        in: query
        required: false
        schema:
          type: string
        description: 'Filters audiences by processing status. Use READY to find audiences eligible for immediate use in measurement workflows. Exports can be created against an audience in any status. `PROCESSING` and `QUEUED` indicate the audience is being built and is not yet usable. `FAILED` indicates processing encountered an error. Accepts multiple values (OR logic); case-insensitive. Available values: `QUEUED`, `PROCESSING`, `READY`, `FAILED`.'
      - name: useCases
        in: query
        required: false
        schema:
          type: string
        description: 'Filters audiences to those supporting at least one of the specified use cases. The use_cases property on an audience determines which downstream operations are available — e.g., only audiences with `AD_MEASUREMENT` can be used in ad measurement campaigns. Case-insensitive; accepts multiple values (OR logic). Available values: `ACTIVATION`, `AD_MEASUREMENT`, `CONTENT_MEASUREMENT`.'
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: audience_list
  /v2/audiences/lookupDemographicFilterFields:
    get:
      operationId: audience_demographic_filter_field_lookup
      summary: Lookup Demographic Filter Fields
      tags:
      - audiences
      description: |-
        Returns a paginated list of demographic filter fields available for building Custom Demographic audiences. Each entry contains the field identifier (`field`), a human-readable label, and a detailed description of the demographic attribute.

        **Why**: Useful for two scenarios: populating UI field selectors (e.g., dropdowns in an audience builder) where the available fields are not known ahead of time, and validating or exploring available field identifiers before writing code that references them. Programmatic callers with known field identifiers (e.g., AGE_RANGE) do not need to call this endpoint at runtime. Results change infrequently; cache for session duration when called.

        **When**: Call when building a UI that lets users select demographic fields, or when exploring what fields are available for the first time. Not required as a prerequisite before every audience creation — if the field identifiers are already known, use them directly in Filter.field. Use the `search` parameter to filter by keyword when looking for a specific attribute.

        **How**: Paginate using `pageSize` and `pageToken`. Pass the returned `field` value directly as Filter.field when calling POST /v2/audiences. To discover valid values for a given field, use GET /v2/audiences/lookupDemographicFilterValues.
      parameters:
      - name: pageSize
        in: query
        required: false
        schema:
          type: string
        description: Query param pageSize specifies the number of results to include in a page of results. Defaults to a server-determined page size when omitted. Use larger values (50-100) when building field selectors that display a complete list; use smaller values for progressive-loading UI components. Must be a positive integer. Pair with `pageToken` to paginate through the full catalog. Excessively large values may increase response latency.
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: Query param 'pageToken' specifies the value of the next page to retrieve within a paginated set of results. Valid values can be found in paginated responses that include field 'next_page_token'. When requesting the next page, additional query parameters should NOT change between page requests.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Optional keyword filter to narrow the list of demographic filter fields. Performs a case-insensitive substring match against the 'field' identifier (e.g., AGE_RANGE), the 'description' text, and the 'label' display name (e.g., Age Range). Use when you know part of the field name, description, or display label to quickly locate a specific demographic attribute. Omit to retrieve all available fields. Combine with 'pageSize' for efficient browsing of large field catalogs.
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: audience_demographic_filter_field_lookup
  /v2/audiences/lookupDemographicFilterValues:
    get:
      operationId: audience_demographic_filter_value_lookup
      summary: Lookup Demographic Filter Values
      tags:
      - audiences
      description: |-
        Returns a paginated list of valid values for a specific demographic filter field. Each entry contains the value identifier (`value`), a human-readable label, and a description of what the value represents.

        **Why**: Before creating a CUSTOM_DEMOGRAPHIC audience, you must know the valid values for each Filter.field you intend to use. This endpoint is the authoritative source for the allowed Filter.values for a given field — do not hardcode value identifiers. The value catalog is field-specific and may vary by organization; call once per session and cache results.

        **When**: Call after discovering available filter fields via GET /v2/audiences/lookupDemographicFilterFields. Pass the `field` identifier (e.g., AGE_RANGE) to retrieve its valid values. Use the `search` parameter to narrow results when looking for a specific value. Call once per session per field and cache the results — the value catalog changes infrequently.

        **How**: Supply the required `field` parameter with a field identifier from the fields endpoint. Pass the returned `value` string directly in Filter.values when calling POST /v2/audiences. Paginate using `pageSize` and `pageToken`. Related: GET /v2/audiences/lookupDemographicFilterFields (discover field identifiers), POST /v2/audiences (create a CUSTOM_DEMOGRAPHIC audience using the discovered values).
      parameters:
      - name: field
        in: query
        required: true
        schema:
          type: string
        description: 'The demographic filter field identifier to look up values for. Must be a valid field identifier returned by GET /v2/audiences/lookupDemographicFilterFields — e.g., ''AGE_RANGE'', ''GENDER'', ''INCOME''. Values are UPPERCASE with underscore separators. Case-sensitive: use the exact string returned by the fields endpoint. Returns 400 if the field identifier is not recognized for the calling organization.'
      - name: pageSize
        in: query
        required: false
        schema:
          type: string
        description: Query param pageSize specifies the number of results to include in a page of results. Defaults to a server-determined page size when omitted. Use larger values (50-100) when building value selectors that display a complete list; use smaller values for progressive-loading UI components. Must be a positive integer. Pair with `pageToken` to paginate through the full value catalog for a field. Excessively large values may increase response latency.
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: Query param 'pageToken' specifies the value of the next page to retrieve within a paginated set of results. Valid values can be found in paginated responses that include field 'next_page_token'. When requesting the next page, additional query parameters should NOT change between page requests.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Optional keyword filter to narrow the list of values for the specified field. Performs a case-insensitive substring match against the 'value' identifier (e.g., 13_15) and the 'description' text. Use when you know part of the value string or its description to quickly locate a specific option. Omit to retrieve all available values for the field. Combine with 'pageSize' for efficient browsing of fields with large value catalogs.
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: audience_demographic_filter_value_lookup
  /v2/audiences/{id}:
    get:
      operationId: audience_get
      summary: Get Audience
      tags:
      - audiences
      description: |-
        Returns the complete Audience resource for a single known audience ID. Use this endpoint when you already have the audience UUID or legacy integer ID and need to retrieve full details including classification, status, use_cases, owned vs. shared ownership, and the classification-specific definition object (exposure, content, composite, etc.).

        **Why**: Retrieve a specific audience directly without filtering through paginated list results. Use to verify audience status before downstream operations such as measurement, export, or sharing. Prefer this over GET /v2/audiences when the audience ID is already known.

        **When**: Call when you need to confirm an audience is READY before use in a downstream workflow, retrieve the full definition object for a known audience ID, or look up audience metadata by ID from an external reference or saved record.

        **How**: Supply the UUID or legacy integer ID as the `id` path parameter. Only READY audiences are eligible for measurement — exports can be created against an audience in any status. Related: GET /v2/audiences (list with filters), POST /v2/audiences (create).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the audience to retrieve. Accepts either a UUID v4 (e.g., 'b21fd4c7-2423-4358-830a-41b3d744e663') or a legacy integer ID encoded as a string (e.g., '"101010101"'). UUID is the preferred format for new integrations. Returns 404 if the audience does not exist or is not accessible to the calling organization.
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: audience_get
    patch:
      operationId: audience_update
      summary: Update Audience
      tags:
      - audiences
      description: |-
        Updates an audience's `name` and/or `description` — the only editable fields. Other attributes (classification, definition, currency of record, use cases, status) are immutable. Provide at least one of `name` or `description`; an empty request returns 400. Returns the full updated Audience.

        **Why**: Rename or re-describe an audience without rebuilding it or losing its computed members and metrics. **Example**: a planner renames "test aud" to "Q1 2025 CTV Reach" before sharing.

        **When**: Call to fix a name or description, or to apply naming standards.

        **How**: Send PATCH /v2/audiences/{id} with the field(s) to change; the update mask is derived from the request body. Precondition: owned by your organization (`ownership=OWNED`; SHARED or SYSTEM returns 403). Editable in any status.

        **Next Steps**: inspect the returned Audience to confirm the change. Related: GET /v2/audiences/{id}, GET /v2/audiences, POST /v2/audiences.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the audience to update. Accepts either a UUID v4 (e.g., 'b21fd4c7-2423-4358-830a-41b3d744e663') or a legacy integer ID encoded as a string (e.g., '"311637"'), the same identifier accepted by GetAudience. UUID is the preferred format for new integrations. Supplied as the '{id}' path parameter. Returns 404 if the audience does not exist or is not accessible to the calling organization.
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp audience_update --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad Request — invalid or unsupported parameter values.
        '401':
          description: Unauthorized — missing or invalid bearer token.
        '403':
          description: Forbidden — the caller's organization is not permissioned for this resource.
      x-videoamp-cli-command: audience_update
  /v2/shares:
    post:
      operationId: share_resources_create
      summary: Bulk Create Shares
      tags:
      - shares
      description: |-
        ### What

        Creates a new resource share granting one or more recipients access to one or more resources such as audiences. Supports bulk operations with up to 100 recipients and 100 resources per request.

        ### Why

        Enables organizations to securely share data assets with partners, agencies, and advertisers within the VideoAmp ecosystem. Essential for cross-organizational collaboration on audience targeting, campaign planning, and measurement. Consent-based sharing ensures data governance compliance.

        ### When

        - Share audiences with agency partners for campaign activation
        - Grant advertiser access to custom audience segments
        - Distribute measurement audiences to multiple recipients simultaneously
        - Establish data sharing relationships for collaborative analytics

        Use POST /v1/shares for single-recipient sharing. Use GET /v1/shares to discover existing shares. Use DELETE /v1/shares/{id} to revoke access.

        ### How

        Requires valid JWT authentication. Provide recipients array with kind and id for each recipient, resources array with legacy integer identifiers, optional name, and optional permissions beyond read access. Pre-approval may be required for certain resource types - contact VideoAmp support for onboarding. Returns share ID for tracking. Returns 400 for validation errors, 403 for unauthorized sharers.

        ### Example

        ```json
        {
          "recipients": [{"id": "10", "kind": "ORGANIZATION"}],
          "resources": ["277777"],
          "name": "Share to Partner Org"
        }
        ```

        **Notes:**
        - `resources`: Use the audience's legacy integer ID (`audienceId` from v1 API, or `legacy_id` from v2 API), not UUIDs
        - `recipients[].kind`: ORGANIZATION, ADVERTISER, AD_AGENCY, BRAND, SUB_BRAND, or PRODUCT
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp share_resources_create --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad Request — invalid or unsupported parameter values.
        '401':
          description: Unauthorized — missing or invalid bearer token.
        '403':
          description: Forbidden — the caller's organization is not permissioned for this resource.
      x-videoamp-cli-command: share_resources_create
  /v2beta/plans:
    post:
      operationId: plan_draft_create
      summary: Create Plan (Draft)
      tags:
      - plans
      description: |-
        Starts the draft branch of the planning workflow by creating a media plan in DRAFT status for a campaign. The draft captures the budget-allocation strategy — budget, constraints, objectives, filters, and rates — so it can be refined before optimization.

        **Why**: A media plan can be produced two ways — submitted complete and sent straight to optimization, or built incrementally through draft → edit → approve. This endpoint begins the incremental path: create the draft now, refine it, and approve it when ready. Rates are not required while the plan is a draft.

        **When**: First step of the draft workflow. Call with a campaign_id and display_name; refine the draft with PATCH /v2beta/plans/{plan_id}, then submit it with POST /v2beta/plans/{plan_id}:approve.

        **How**: Submit the plan configuration in the request body. Returns 201 with the created Plan including server-assigned `id` and `status` = DRAFT. The inventory_set_id, audiences, and creative durations are derived from the campaign.
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp plan_draft_create --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: plan_draft_create
  /v2beta/plans/{planId}:
    patch:
      operationId: draft_plan_update
      summary: Patch Plan (Draft)
      tags:
      - plans
      description: |-
        Refines a DRAFT media plan in the draft branch of the planning workflow. Send only the fields you want to change; omitted fields keep their current values.

        **Why**: Lets planners iterate on a draft — adjust budget, constraints, objectives, filters, or rate card / overrides — between creating it and approving it for optimization.

        **When**: While the plan is still in DRAFT status, after it is created and before it is approved.

        **How**: Supply the plan UUID as `plan_id`. Merge semantics: a field omitted (null) is left unchanged; an explicit empty array `[]` clears that collection (e.g. remove all constraints); an empty string for `rate_card_id` detaches the rate card. Returns 200 with the updated Plan.
      parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
