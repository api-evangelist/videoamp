        The caller must have write access on the parent DataStream's advertiser. Inspection may complete synchronously or asynchronously — check `status` in the response. If `status` is `PENDING`, the inspection is still running; poll `GetDeliveryInspection` until `status` is `SUCCEEDED` or `FAILED`. A terminal status in the response means the inspection completed synchronously.

