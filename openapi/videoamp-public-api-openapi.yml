      x-videoamp-cli-command: datasource_group_delete
    get:
      operationId: datasource_group_get
      summary: Get Datasource Group
      tags:
      - library
      description: |-
        ### What

        Retrieves a complete Datasource Group configuration by UUID, including metadata, Datasources, and Rules count.

        ### Why

        Datasource Groups are essential for specifying vendor data, date ranges, and filters to constrain the context when building a Measurement report.

        ### When

        - Use this endpoint for validating configuration before report creation, displaying metadata in UI, auditing for compliance, troubleshooting errors, and checking soft-delete status.
        - Avoid using this endpoint for first-time discovery, bulk retrieval, or existence checks; use `List` for those cases instead.

        ### Next steps

        Validate that date ranges match report needs. Use `id` in `POST /v2beta/adMeasurements`. If `total_rules` > 0, call `GET /v1/library/datasourceGroups/{id}/rules` for more associated rule details.

        ### Related endpoints

        - `GET /v1/library/datasourceGroups` - List Datasource Groups
        - `GET /v1/library/datasourceGroups/{id}/rules` - List Rules for a Datasource Group
        - `POST /v2beta/adMeasurements` - Create a report
        - `DELETE /v1/library/datasourceGroups/{id}` - Delete a Datasource Group

        See [help page](https://help.videoamp.dev/en/articles/11429358-datasource-groups-and-rules) for details.
      parameters:
      - name: datasourceGroupId
        in: path
        required: true
        schema:
          type: string
        description: 'UUID v4 identifier for Datasource Group to retrieve. Obtained from ''List'' endpoint or creation response. Required for all ''GET'' operations. Returns 404 if group doesn''t exist, user lacks access, or group is soft-deleted (set ''includeDeleted = true'' to retrieve deleted groups). Fetches complete configuration including metadata, Datasources, and Rule counts. Primary use: validating group before Measurement report creation.'
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: string
        description: Controls soft-deleted group retrieval. Default false verifies if group is active (404 if ID is deleted). Set to `true` to corroborate if group is deleted. Deleted groups retain configuration and `deleted_at` timestamp but cannot be used in new reports. Useful for lineage tracking, compliance audits, or recovering configuration to recreate. (default true)
      - name: includeEventCounts
        in: query
        required: false
        schema:
          type: string
        description: 'Opt-in. When true, populates `event_count` on the returned Datasource Group with best-effort event counts. No-op when `top_level_only=true`: the summary fetch never populates `datasources`, so `event_count` is always returned as unavailable (empty `counts_by_unit`). (default true)'
      - name: ownership
        in: query
        required: false
        schema:
          type: string
        description: 'Verify Datasource Group ownership and access rights. ''OWNED'' returns group if all Datasources are fully owned by your organization (404 if ''SHARED''). ''SHARED'' returns group if it contains a mix of owned and shared Datasources (404 if all ''OWNED''). ''OWNERSHIP_FILTER_UNSPECIFIED'' (default) returns the group regardless of ownership status. - OWNERSHIP_FILTER_UNSPECIFIED: Default filter value that returns all Datasource Groups regardless of ownership status. - OWNED: Returns only Datasource Groups where all constituent Datasources are fully owned by your organization with unrestricted usage rights. - SHARED: Returns only Datasource Groups that contain a mix of owned and shared Datasources where some Datasources may have contractual usage restrictions or access limitations.'
      - name: topLevelOnly
        in: query
        required: false
        schema:
          type: string
        description: Performance optimization controlling payload size. Default false returns complete group with all Datasources. Set to `true` to retrieve only metadata (ID, name, dates, advertiser, Rule count) excluding `datasources` array. Use for fast UI dropdowns, existence checks, or audits when Datasource details are not necessary. (default true)
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: datasource_group_get
  /v1/library/datasourceGroups/{datasourceGroupId}/rules:
    post:
      operationId: datasource_group_rule_create
      summary: Create Rule
      tags:
      - library
      description: |-
        ### What

        Creates a Rule scoped to a Datasource Group (DSG). The Rule's `strategy_definition` is a tree of `RuleItem`s combining filter conditions with boolean operators; it constrains which underlying datasource records contribute to measurement reports built on the DSG.

        ### Why

        Rules persist reusable, label-bearing slices of a DSG so downstream reports render meaningful breakdowns instead of bare identifiers — e.g., an analyst scoping a report to specific LINEAR networks, or a data engineer slicing a DSG by source dimension.

        ### When

        Use to programmatically scope DSG measurement to a subset of underlying data. **Do NOT use** for ad-hoc filtering that need not persist, for filters not exposed by `datasource_rule_filter_name_search` on the target DSG, or against competitor / unsupported-scope DSGs (fails `DGR_0001` / `DGR_0003` / `DGR_0004`).

        ### How

        **Workflow** to build a leaf `RuleItem`:
        1. Call `datasource_rule_filter_name_search` → pick a `RuleFilterNameOption`. Its `value` → `field`; `label` → `field_label`.
        2. If the filter is shared across LINEAR/DIGITAL (`advertiser`, `creative`) and medium is ambiguous, **ask — do not guess.**
        3. Call `datasource_rule_filter_value_search` with the chosen `field` and `medium` → pick `RuleFilterValueOption`s. Values → `values`; labels → `value_labels`.
        4. Wrap leaves per the double-nesting constraint on `RuleDefinition`; populate all four leaf fields.

        ### Next Steps

        Reference the new Rule by `id` in measurement-report calls. Use `datasource_group_rule_get` to confirm; `datasource_group_rule_list` to enumerate.

        ### Related Endpoints

        `datasource_rule_filter_name_search`, `datasource_rule_filter_value_search`, `datasource_group_rule_get`, `datasource_group_rule_list`, `datasource_group_rule_delete`.

        See [help page](https://help.videoamp.dev/en/articles/11429358-datasource-groups-and-rules) for more on Datasource Groups and Rules.
      parameters:
      - name: datasourceGroupId
        in: path
        required: true
        schema:
          type: string
        description: The Datasource Group ID that the Rule belongs to. Must reference a DSG the caller has access to whose reporting scope and datasource types support rules; otherwise the call fails with 'DGR_0001' / 'DGR_0003' / 'DGR_0004'.
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp datasource_group_rule_create --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: datasource_group_rule_create
    get:
      operationId: datasource_group_rule_list
      summary: List Rules
      tags:
      - library
      description: |-
        Retrieves all Rules associated with a user or by Datasource Group ID, with the ability to bulk fetch by providing a list of Rule IDs. Use the `-` character to list all Rules associated to a user. Otherwise, provide the Datasource Group ID in the path to return Rules associated to the Datasource Group ID. The response includes a list of all Rules.
        Please view our [help page](https://help.videoamp.dev/en/articles/11429358-datasource-groups-and-rules) for more information on how Datasource Groups and Datasource Group Rules are used.
      parameters:
      - name: datasourceGroupId
        in: path
        required: true
        schema:
          type: string
        description: Specify the Datasource Group ID to fetch Rules for. Use '-' to retrieve Rules from all Datasource Groups.
      - name: ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: List of Rule IDs to retrieve a bulk set of specific Rules.
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
        description: Default false. Deleted Rules will only be included when true. (default true)
