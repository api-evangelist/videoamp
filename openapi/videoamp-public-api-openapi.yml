        in: query
        required: false
        schema:
          type: string
        description: Query param pageSize specifies the number of results to include in a page of results. Defaults to 20 if not specified. Maximum allowed value is 200.
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: Query param 'pageToken' specifies the value of the next page to retrieve within a paginated set of results. Valid values can be found in paginated responses that include field 'next_page_token'. When requesting the next page, additional query parameters should NOT change between page requests.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Free-text search query to filter Rules by 'name' and 'description' fields. Performs case-insensitive partial match against Rule names and descriptions. When omitted, no text filtering is applied and all rules matching other criteria are returned. When provided, only rules with names or descriptions containing the search term as a substring are included. Useful for quickly finding rules when you remember part of the name or description but not the full name or ID. Search is not tokenized - the entire search string is matched as a phrase. Combine with other filters like 'datasource_group_id' for more precise results.
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: datasource_group_rule_list
  /v1/library/datasourceGroups/{datasourceGroupId}/rules/{ruleId}:
    delete:
      operationId: datasource_group_rule_delete
      summary: Delete Rule
      tags:
      - library
      description: |-
        Soft deletes a Rule by its unique identifier (UUID). The resource can still be referenced by ID but will not be included in list results unless `include_deleted` is set to true.
        Please view our [help page](https://help.videoamp.dev/en/articles/11429358-datasource-groups-and-rules) for more information on how Datasource Groups and Datasource Group Rules are used.
      parameters:
      - name: datasourceGroupId
        in: path
        required: true
        schema:
          type: string
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: datasource_group_rule_delete
    get:
      operationId: datasource_group_rule_get
      summary: Get Rule
      tags:
      - library
      description: |-
        Retrieves complete details of a specific Rule by UUID including name, description, Rule definition with operators and filters, and metadata (creator, timestamps). Use `top_level_only=true` to retrieve metadata without nested items for reduced response size. Use `include_deleted=true` to retrieve soft-deleted Rules.

        **Why**: Rules define criteria for grouping measurement data within Datasource Groups. Rules are optional to use and they provide customers with additional flexibility to view their data grouped in ways that may not be native in report views. Understanding Rule details is essential for configuring accurate measurement analyses and troubleshooting data grouping behavior.

        **When to Use**:
        - Display Rule configuration in UI or validate before applying to reports
        - Troubleshoot unexpected measurement results or check soft-delete status for lineage tracking

        **How**: Requires bearer token authentication with read permissions.

        **Error Handling**:
        - 404: Rule not found or user lacks access (set `include_deleted=true` to retrieve soft-deleted Rules)
        - 400: Invalid UUID format

        **Related Endpoints**:
        - `GET /v1/library/datasourceGroups/{datasourceGroupId}/rules` - List all Rules for a Datasource Group
        - `POST /v1/library/datasourceGroups/{datasourceGroupId}/rules` - Create new Rule
        - `DELETE /v1/library/datasourceGroups/{datasourceGroupId}/rules/{ruleId}` - Delete Rule

        **Common Workflow**: List Rules -> Get detailed config -> Apply to measurement report

        See our [help page](https://help.videoamp.dev/en/articles/11429358-datasource-groups-and-rules) for more information on Datasource Groups and Rules.
      parameters:
      - name: datasourceGroupId
        in: path
        required: true
        schema:
          type: string
        description: 'UUID v4 identifier of Datasource Group containing the target Rule. Datasource Groups are parent containers that organize Rules for measurement analysis. Use ''-'' wildcard to retrieve Rules without knowing parent group ID (returns Rule if found in any accessible group). Format accepts standard UUID or ''-'' character. Common use: retrieving Rules when only Rule ID is known, or validating parent-child relationship for configuration audits. Returns 404 if not found or not accessible.'
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
        description: 'UUID v4 identifier for specific Rule to retrieve. Obtained from List endpoint, creation response, or UI selection. Required for all GET operations. When ''include_deleted'' is false (default), returns 404 if rule is soft-deleted. When ''include_deleted'' is true, retrieves deleted rules. Also returns 404 if rule doesn''t exist or user lacks access. Fetches complete configuration including name, description, strategy definition with operators and filters, and metadata (creator, timestamps). Primary use: validating rule configuration before applying to measurement reports or displaying rule details in UI.'
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
        description: Controls soft-deleted rule retrieval. Default false returns only active rules (404 if ID is deleted). Set to true to retrieve deleted rules for audit trails, historical analysis, compliance reporting, or recovering configuration to recreate. Deleted rules retain all configuration data and deleted_at timestamp but cannot be used in new measurement reports. Useful for lineage tracking when investigating reports created before rule deletion. (default true)
      - name: topLevelOnly
        in: query
        required: false
        schema:
          type: boolean
        description: Performance optimization controlling payload size. Default false returns complete rule with all nested items (strategy definition, filters, operators, values). Set to true to retrieve only metadata (ID, name, description, timestamps) excluding strategy_definition array. Significantly reduces response size and latency for rules with extensive filter configurations. Use for fast UI dropdowns, existence checks, or audits when item details are unnecessary. (default true)
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad Request — invalid or unsupported parameter values.
        '401':
          description: Unauthorized — missing or invalid bearer token.
        '404':
          description: Not Found — the resource does not exist or is not accessible to the calling organization.
      x-videoamp-cli-command: datasource_group_rule_get
  /v1/library/datasourceTypeOptionsSearch:
    post:
      operationId: datasource_type_search
      summary: Search Datasource Types
      tags:
      - library
      description: |-
        ### What

        Returns available datasource types for a given advertiser and filter parameters. Must supply reporting scope and medium filters.

        ### Why

        Discovers valid datasource_type values for Datasource Group (DSG) creation.

        **Business Scenarios:**
        - User finds VA_PIXEL type is available by searching reporting_scope=AD_MEASUREMENT and medium=DIGITAL
        - Agent discovers NATIONAL_LINEAR_BROADCAST_AND_CABLE by searching with reporting_scope=CONTENT_MEASUREMENT and medium=LINEAR
        ### When

        Call after selecting reporting_scope, advertiser_id, and date range desired for datasource group.

        **Important:** To discover all available datasource types, call this endpoint twice: once with `medium=DIGITAL` and once with `medium=LINEAR`. If a date range is provided, the types returned have data within that range.

        **Do NOT use when:**
        - You already know the exact datasource_type
        **Next Steps:** Select a type from results, then call `POST /v1/library/datasourceFilterNameOptionsSearch` with that type.

        ### How

        **Discovery Pattern:** Try DIGITAL first (faster queries), then LINEAR (slower). Combine results from both calls to see all available types by medium.
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp datasource_type_search --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: datasource_type_search
  /v1/library/ruleFilterNameOptionsSearch:
    post:
      operationId: datasource_rule_filter_name_search
      summary: Search Rule Filter Names
      tags:
      - library
      description: |-
        ### What

        Returns the valid filter names (`field` identifiers) for building a leaf `RuleItem` against a specific Datasource Group (DSG). The runtime per-DSG set depends on the DSG's datasource types — always discover via this call; the static `rule_filter_name.in:` list is the cross-DSG universe, not the per-DSG subset.

        ### Why

        The valid `field` identifiers vary per DSG based on its constituent datasource types. The static `rule_filter_name.in:` enum is the cross-DSG universe, not the per-DSG allowlist — discover the applicable identifiers here before calling value search to avoid `DSO_0023_RULE_FILTER_NOT_SUPPORTED_ON_DSG` failures and rules that target unsupported filters.

        ### When

        Step 1 of the rule-creation chain. Call after picking a DSG, before `RuleFilterValueOptionsSearch`. Skip if you already hold a validated `RuleItem.field` for this DSG.

        ### How

        Each `RuleFilterNameOption` supplies:
        - `value` → `RuleItem.field`
        - `label` → `RuleItem.field_label` (required to persist the rule with readable field names; used by API/MCP and UI consumers)
        - `medium` → pass through to `RuleFilterValueOptionsSearchRequest.medium`

        Shared LINEAR/DIGITAL filters (`advertiser`, `creative`) appear once per medium. When the user's intent doesn't specify, **ask — do not guess.**

        ### Next Steps

        For each chosen option, call `RuleFilterValueOptionsSearch` with `datasource_group_id`, `rule_filter_name = option.value`, `medium = option.medium`.

        ### Related

        `RuleFilterValueOptionsSearch`, `CreateRule`. [help page](https://help.videoamp.dev/en/articles/11429353-datasource-options).
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp datasource_rule_filter_name_search --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: datasource_rule_filter_name_search
  /v1/library/ruleFilterValueOptionsSearch:
    post:
      operationId: datasource_rule_filter_value_search
      summary: Search Rule Filter Values
      tags:
      - library
      description: |-
        ### What

        Returns the valid values (`RuleItem.values` entries) for a given `rule_filter_name` on a specific Datasource Group (DSG). Each entry carries a label that maps to `RuleItem.value_labels`.

        ### Why

        Value identifiers and their human-readable labels are per-DSG and not derivable from the filter name alone. Fetching them here is the only way to obtain the correct `values` and `value_labels` to populate on the leaf `RuleItem`.

        ### When

        Step 2 of the rule-creation chain. Call once per leaf `RuleItem`, after `RuleFilterNameOptionsSearch`. **`medium` is effectively required** — pass `RuleFilterNameOption.medium` through; see the `medium` field for the CROSS_SCREEN footgun and `DSO_0023` failure.

        ### How

        Each option supplies `value` (→ append to `RuleItem.values`) and `label` (→ `RuleItem.value_labels[value]`; required to persist the rule with readable labels). Populate all four leaf fields together; partial leaves persist with bare identifiers (used by API/MCP and UI consumers alike). Pass the leaf to `CreateRule`.

        **Worked example:**
        ```
        1. NameSearch(dsg_id) → {value:"campaign", label:"Campaign", medium:DIGITAL}
        2. ValueSearch(dsg_id, rule_filter_name:"campaign", medium:DIGITAL) → {value:"camp_1", label:"Spring 24"}
        3. Leaf: {field:"campaign", field_label:"Campaign", operator:"=", values:["camp_1"], value_labels:{"camp_1":"Spring 24"}}
        ```

        ### Next Steps

        Assemble all four leaf fields together — `field` (from name search), `field_label` (from name search), `values` (from this call), `value_labels` (from this call) — and pass the completed leaf `RuleItem` to `CreateRule`.

        ### Related

        `RuleFilterNameOptionsSearch`, `CreateRule`. [help page](https://help.videoamp.dev/en/articles/11429353-datasource-options).
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp datasource_rule_filter_value_search --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: datasource_rule_filter_value_search
  /v1/me:
    get:
      operationId: user_info_get
      summary: Get Current User
      tags:
      - me
      description: |-
        ### What

        Returns authenticated user profile including personal details (name, email), and business entity memberships (holding companies, agencies, advertisers). Delivers identity (UUID, names, email) plus org hierarchy for authorization and multi-tenant resource scoping.

        ### Why

        - App initialization: provides identity, org context, and permissions for session management
        - Multi-tenant isolation: enforces resource scoping and authorization decisions
        - **Business Name Resolution**: Discover UUIDs from business names (e.g., "Genesis") via `memberships` array

        ### When

        - App startup after authentication
        - Login completion to establish state
        - User menu rendering
        - Business entity selector population
        - Pre-flight validation before mutations
        - **When users reference businesses by name** - resolve to UUID for API calls

        ### How

        - Auth: OAuth2 Bearer token (identity from JWT claims)
        - Latency: ~100ms
        - Returns: user UUID, name, email, org UUID, memberships array
        - Cache per session; refresh on permission changes
        - **Name→UUID Resolution**: Search `memberships` for `display_name` match, use `id` field in API calls. Filter with `?membership_search=Genesis&membership_kinds=ADVERTISER`

        ### Organization Identity & Cross-API Usage

        `current_organization_id`, the deprecated `organizations` array, and the `memberships` entry where `kind = HOLDING_COMPANY` all share the **same UUID** referencing the same organization (tenant).

        Pass this UUID as `org_id`, `public_org_id`, or `organization_id` in other VideoAmp APIs (Library, Deal, Share, Forecast, etc.).

        "Organization" = tenant. `HOLDING_COMPANY` in `memberships` = its access-hierarchy representation (1:1, same UUID). Some legacy APIs accept a numeric `holding_company_id` — that is a different identifier, not this UUID.
      parameters:
      - name: include_memberships
        in: query
        required: false
        schema:
          type: string
        description: Filter support If true, includes the memberships array in the response. Set to false to omit business entity details for lightweight responses when organizational context is not needed. Default is true. (default true)
      - name: membership_kinds
        in: query
        required: false
        schema:
          type: string
        description: 'If provided, filters the memberships array to only include business entities of the specified kinds (e.g., only `ADVERTISER` entities). If empty or not set, all membership kinds are returned. Accepts multiple values for combined filtering.Ex: /v1/me?membership_kinds=ADVERTISER,AD_AGENCY to return both ADVERTISER and AD_AGENCY. **Cross-API note**: The Sharing API uses `ORGANIZATION` instead of `HOLDING_COMPANY` — translate when passing kind values to sharing endpoints. - HOLDING_COMPANY: Top-level entity in the business/access hierarchy, corresponding to "Organization" (tenant) in external terminology. The `id` of a HOLDING_COMPANY business entity is the same UUID as `current_organization_id` from the `/v1/me` response. This UUID can be used as `org_id`, `public_org_id`, or `organization_id` in other APIs accepting string UUIDs. - AD_AGENCY: Media buying agency under a holding company. Same as `AD_AGENCY` in Sharing API''s SubjectKind. - ADVERTISER: Brand or advertiser purchasing media. Same as `ADVERTISER` in Sharing API''s SubjectKind. Use `membership_kinds=ADVERTISER` for name resolution to avoid returning agencies with the same name.'
      - name: membership_search
        in: query
        required: false
        schema:
          type: string
        description: Optional search string to filter 'memberships' by display name. Performs case-insensitive substring match against the 'display_name' field of each business entity. Useful for implementing search-as-you-type functionality in business entity selectors. If empty or not set, no name filtering is applied.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
        description: Pagination for memberships Number of membership records to return per page. Used for paginating through large sets of business entity memberships. If not set a default page size of 999 is used.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
        description: Token from a previous 'IdentifyUser' response to retrieve the next page of membership results. Used in conjunction with 'page_size' for pagination. If not set, retrieves the first page.
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: user_info_get
    patch:
      operationId: user_profile_update
      summary: Update User Profile (Internal Only)
      tags:
      - me
      description: |-
        ### What

        Updates the authenticated user's profile settings, specifically the current organization context. Changes which organization the user is operating within, affecting resource visibility, permissions, and data filtering across the platform. Returns updated user profile including the new organization context and available memberships. This endpoint only updates `current_organization_id`. Other profile fields (`given_name`, `family_name`, `email`) are read-only and cannot be modified through this endpoint.

        ### Access Control

        **RESTRICTED TO INTERNAL VIDEOAMP USERS ONLY**: This endpoint is only accessible to VideoAmp employees. External users will receive `403 Forbidden` when attempting to access this endpoint.

        ### Why

        - Internal users need to switch between organizations for administrative and support operations
        - Multi-tenant applications require organization context switching for proper resource scoping
        - Session state must reflect the active organization for authorization and data filtering
        - UI components (org selectors) need to persist user's organization selection across sessions
        ### When

        - Call when user selects a different organization from an org selector dropdown
        - Use during application initialization if user's last-selected org differs from JWT claim
        - Execute before cross-organization operations requiring context switch
        ### How

        - Auth via OAuth2 Bearer token (identity derived from JWT claims)
        - Provide organization UUID in request body via `current_organization_id` field
        - User must have membership in the specified organization
        - Returns full IdentifyResponse with updated `current_organization_id` field
        - Client applications may need to refresh session after org switch for updated claims
        - Response includes updated memberships array with same pagination as `/v1/me`.
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp user_profile_update --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
        '403':
          description: Forbidden — the caller's organization is not permissioned for this resource.
      x-videoamp-cli-command: user_profile_update
  /v1/me/orgs:
    get:
      operationId: user_organization_list
      summary: List All User Organizations
      tags:
      - me
      description: |-
        ### What

        Returns **ALL organizations** the authenticated user has access to or can switch to. Provides complete list of organizations with UUID, display name, and organizational kind.

        **Key Distinction from `/v1/me`:**
        - This endpoint (`/v1/me/orgs`) returns **ALL** organizations the user can access
        - `/v1/me` returns only the **current** organization (via `current_organization_id` field)

        ### Why

        - Organization switching: Shows which organizations users can switch between
        - Access discovery: Users need to see what organizations they can access
        - UI population: Powers organization selector dropdowns
        - Admin tools: View and manage user organization memberships
        - Troubleshooting: Verify organizational access for permission issues

        ### When

        **Use this endpoint when users ask about:**
        - "What organizations can I switch to?" / "List all my organizations"
        - "What organizations do I have access to?"
        - Any variation of listing/viewing available organizations

        **Do NOT use for current org context** → Use `GET /v1/me` instead

        ### How

        - User identity derived automatically from OAuth2 Bearer token (JWT subject claim)
        - No request parameters required - operates on authenticated user
        - Typical latency under 200ms
        - Returns array of organizations with `id` (UUID), `display_name` (string), `kind` (enum)
        - No pagination required (users typically belong to <100 organizations)

        Each organization `id` here is the same UUID that appears as `current_organization_id` in `/v1/me` and as the `HOLDING_COMPANY` membership's `id`. Use it as `org_id`, `public_org_id`, or `organization_id` in other APIs.
      responses:
        '200':
          description: Successful response.
        '401':
          description: Unauthorized — missing or invalid bearer token.
      x-videoamp-cli-command: user_organization_list
  /v1/shares:
    get:
      operationId: share_list
      summary: List Shares
      tags:
      - shares
      description: |-
        ### What

        Retrieves a paginated list of resource shares matching filter criteria. Returns share metadata including sharer organization, recipients with permissions, resources with types and names, lifecycle status, and audit trail.

        ### Why

        Enables discovery and monitoring of sharing relationships across organizations. Essential for auditing data access, managing permissions, tracking resource distribution, and compliance. Target users: audience owners sharing their data, users viewing and managing shares created by their organization, platform operations via share management UI, and audience teams.

        ### When

        - Discover all shares created by your organization
        - Filter by kind (e.g., ADVANCED_AUDIENCE) to view all audience shares specifically
        - Validate whether shares are successful or deleted when recipients report access issues
        - Audit resource access across organizational boundaries for QA and compliance
        - Monitor share lifecycle status changes between ACTIVE and DELETED
        - Build share management dashboards and compliance reports

        Use GET /v1/shares/{id} for single share details. Use POST /v1/shares to create new shares.

        ### How

        Requires valid JWT authentication. Use pageSize and pageToken for pagination through results. Use q parameter for filtering by kind or createdAt. Returns 400 for invalid params, 403 for auth errors, 500 for server errors.
      parameters:
      - name: fetchRecipientAncestorPath
        in: query
        required: false
        schema:
          type: boolean
        description: 'When true, includes the ancestor_path field for each recipient showing their full position in the organizational hierarchy from root to leaf. This hierarchical path is essential for understanding the sharing scope within complex multi-level organizational structures. Use this to display breadcrumb navigation in UIs, validate sharing permissions at the correct org level, or audit which parent entities have inherited access. Performance note: enabling this adds a lookup per recipient, so omit for large result sets where hierarchy is not needed. (default true)'
      - name: order
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: 'Order by attribute(s): - createdAt (ASC, DESC) Sort order for results controlling how shares are ordered in the response. Format: ''createdAt ASC'' for oldest first or ''createdAt DESC'' for newest first. Defaults to createdAt DESC when not specified. Important: changing the order parameter between paginated requests invalidates the pageToken and you must restart from page 1. This ensures consistent ordering across pages. For audit workflows, use ASC to process shares chronologically from oldest to newest. For monitoring dashboards, use DESC to see most recent shares first.'
      - name: pageSize
        in: query
        required: false
        schema:
          type: string
        description: Query param pageSize specifies the number of results to include in a page of results.
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: 'Query param ''pageToken'' specifies the value of the next page to retrieve within a paginated set of results. Valid values can be found in paginated responses that include field ''next_page_token''. When requesting the next page, additional query parameters should NOT change between page requests. - createdAt ISO 8601 formatted string (gt, lt, gte, lte) - kind `string` (eq, in) - resourceId `string` (eq, in) Advanced query filter for attribute-based filtering. Supported attributes: - **kind**: Filter by resource kind. Operators: eq, in. Currently supported: ADVANCED_AUDIENCE. - **createdAt**: Filter by creation date (ISO 8601). Operators: gt, lt, gte, lte. - **resourceId**: Filter by resource id. Operators: eq, in. Use the same id supplied as resource.id in POST /v1/shares (or resources[] in POST /v2/shares). Multiple q parameters are AND''d by default. Prefix with ''or'' for OR logic. Examples: - ?q=kind eq ADVANCED_AUDIENCE - ?q=createdAt gt 2025-01-01T00:00:00Z - ?q=resourceId eq 277777 - ?q=resourceId in 277777,277778 - ?q=kind eq ADVANCED_AUDIENCE&q=createdAt gte 2025-01-01'
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad Request — invalid or unsupported parameter values.
        '401':
          description: Unauthorized — missing or invalid bearer token.
        '403':
          description: Forbidden — the caller's organization is not permissioned for this resource.
        '500':
          description: Internal Server Error.
      x-videoamp-cli-command: share_list
    post:
      operationId: share_resource_create
      summary: Create Share
      tags:
      - shares
      description: |-
        ### What

        Creates a share granting a single recipient access to a single audience resource. Returns the complete Share object including recipients, resources, status, and audit trail.

        ### Why

        Provides simple single-recipient, single-resource sharing for straightforward use cases. Returns full share details immediately for verification without requiring an additional GET call. Ideal for simple integrations and UI-driven workflows.

        ### When

        - Share one audience with one recipient and verify details in the response
        - Simple integrations that share one resource at a time
        - UI-driven sharing where user selects one audience and one recipient

        For bulk operations (multiple recipients or resources), use POST /v2/shares instead. Verify consent exists via GET /v1/consents before sharing.

        ### How

        Requires valid JWT authentication. Provide share object with recipient (kind and id), resource (legacy integer identifier), optional name, and optional permissions. Set fetch_recipient_ancestor_path=true to include organizational hierarchy in response. Returns 400 for validation errors, 403 if not authorized, 409 if share already exists.

        ### Example

        ```json
        {
          "recipient": {"id": "10", "kind": "ORGANIZATION"},
          "resource": {"id": "277777"},
          "name": "Share to Partner Org"
        }
        ```

        **Notes:**
        - `resource.id`: Use the audience's legacy integer ID (`audienceId` from v1 API, or `legacy_id` from v2 API), not the UUID
        - `recipient.kind`: ORGANIZATION, ADVERTISER, AD_AGENCY, BRAND, SUB_BRAND, or PRODUCT
      parameters:
      - name: fetchRecipientAncestorPath
        in: query
        required: false
        schema:
          type: boolean
        description: When true, includes the ancestor_path field in the response showing the recipient's full position in the organizational hierarchy. Useful for verifying the share was created at the correct organizational level. (default true)
      requestBody:
        required: true
        description: JSON request body. The CLI accepts it via `--json`. The body schema is published only in the authenticated OpenAPI document served to logged-in callers (`videoamp share_resource_create --oas`) and at https://docs.videoamp.dev, both of which require an Auth0 session; it is therefore not reproduced here.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful response.
        '400':
          description: Bad Request — invalid or unsupported parameter values.
        '401':
          description: Unauthorized — missing or invalid bearer token.
        '403':
          description: Forbidden — the caller's organization is not permissioned for this resource.
        '409':
          description: Conflict — the request conflicts with the current state of the resource.
