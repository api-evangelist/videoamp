description: >-
  VideoAmp ships no first-party API client library in any language registry. Its supported
  programmatic distribution is a single Go binary — the `videoamp` CLI, released as GitHub release
  assets — which also embeds the MCP server. The `@videoamp/*` and `*-videoamp` packages on npm are
  genuine VideoAmp publications but are internal front-end tooling (lint configs, an icon set, a Hapi
  route loader, a CSS framework), not clients for the VideoAmp Public API.
