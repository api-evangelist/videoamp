description: >-
  VideoAmp runs an AIP-181 style stability ladder in the URI path — alpha, beta and stable channels
  coexist for the same resources — and ships a continuously released CLI whose version carries an
  `api_edition` date identifying the specification edition it was generated from. It publishes no
  anonymous versioning policy, no deprecation policy page, no SLA, and no status page.
versioning:
  scheme: uri-path
  standard: AIP-181 stability channels
  current_stable: v2
  api_edition: '2026-07-31'
  api_edition_source: videoamp version
  docs: https://docs.videoamp.dev
  channels:
    - {prefix: /v1, stability: stable, operations: 38}
    - {prefix: /v2, stability: stable, operations: 17}
    - {prefix: /v3, stability: stable, operations: 2}
    - {prefix: /v1beta, stability: beta, operations: 23}
    - {prefix: /v2beta, stability: beta, operations: 3}
    - {prefix: /v1alpha, stability: alpha, operations: 23}
    - {prefix: /external/v1, stability: stable, operations: 12}
  parallel_versions:
    - resource: audiences
      channels: [/v1/audiences, /v2/audiences]
      note: >-
        Both are live; the CLI keeps them as separate commands (audience_list / audience_list_v1,
        audience_get / audience_get_v1, audience_create / audience_create_v1).
    - resource: shares
      channels: [/v1/shares, /v2/shares, /v3/shares]
      note: v2 adds bulk creation; v3 adds UUID recipients.
    - resource: consents
      channels: [/v1/consents, /v3/consents]
      note: v3 is the UUID-identifier variant.
    - resource: plans
      channels: [/v1beta/plans, /v2beta/plans]
      note: v2beta adds the draft/approve lifecycle.
