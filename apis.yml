aid: videoamp
name: VideoAmp
description: >-
  VideoAmp is a Los Angeles-based media measurement and advertising technology company, founded in 2014, that
  operates as a certified national TV currency provider alongside Nielsen and Comscore. Its platform unifies
  linear TV, streaming and digital viewership onto a single dataset and identity spine (VALID) so agencies,
  brands and publishers can build audiences, plan and optimize cross-screen media, and measure ad and content
  outcomes. VideoAmp exposes this as a read-and-write Public API at api.videoamp.dev covering audiences,
  campaigns, media plans, inventories and rate cards, reach curves, ad and content measurement, data streams
  and ingestion, and cross-organization data sharing and consent — plus a first-party CLI and a hosted remote
  MCP server so agents can drive the same operations.
