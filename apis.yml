  description: >-
    VideoAmp's hosted remote Model Context Protocol server, exposing 101 tools that mirror the VideoAmp
    Public API operations for audiences, measurement, planning, inventory, data streams and sharing. Streamable
    HTTP transport at https://api.videoamp.dev/v1/mcp, protected by OAuth 2.0 with RFC 9728 protected-resource
    metadata pointing at login.videoamp.com. Can also be run locally via `videoamp mcp start-server`.
