      - type: AgenticAccess
        url: agentic-access/videoamp-agentic-access.yml
  - name: VideoAmp MCP Server
    description: >-
      VideoAmp's hosted remote Model Context Protocol server, exposing 101 tools that mirror the VideoAmp Public
      API operations for audiences, measurement, planning, inventory, data streams and sharing. Streamable HTTP
      transport at https://api.videoamp.dev/v1/mcp, protected by OAuth 2.0 with RFC 9728 protected-resource
      metadata pointing at login.videoamp.com. Can also be run locally via `videoamp mcp start-server`.
    humanURL: https://github.com/VideoAmp/cli
    baseURL: https://api.videoamp.dev/v1/mcp
    tags:
