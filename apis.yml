apis:
  - name: VideoAmp Public API
    description: >-
      The VideoAmp Public API powers audience building and lookup, campaign and media plan creation and
      optimization, inventory sets, rate cards and reach curves, ad and content measurement reporting with
      post-process lift analysis, data stream onboarding with schema mapping and delivery configuration, and
      cross-organization sharing and consent. 117 operations across the v1, v1alpha, v1beta, v2, v2beta and v3
      channels, authenticated with OAuth 2.0 bearer tokens from VideoAmp's Auth0 tenant.
    humanURL: https://docs.videoamp.dev
    baseURL: https://api.videoamp.dev
    tags:
      - media-measurement
      - advertising
      - adtech
      - audience-measurement
      - media-planning
      - attribution
      - data-collaboration
